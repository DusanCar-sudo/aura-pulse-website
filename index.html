<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Pulse — system telemetry, AI clipboard vault &amp; benchmarks</title>

<link rel="stylesheet" href="_ds/aura-design-system-593988d2-0e97-40eb-98f6-2b4b788a7b73/tokens/fonts.css">
<link rel="stylesheet" href="_ds/aura-design-system-593988d2-0e97-40eb-98f6-2b4b788a7b73/tokens/colors.css">
<link rel="stylesheet" href="_ds/aura-design-system-593988d2-0e97-40eb-98f6-2b4b788a7b73/tokens/typography.css">
<link rel="stylesheet" href="_ds/aura-design-system-593988d2-0e97-40eb-98f6-2b4b788a7b73/tokens/spacing.css">
<link rel="stylesheet" href="_ds/aura-design-system-593988d2-0e97-40eb-98f6-2b4b788a7b73/styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="_ds/aura-design-system-593988d2-0e97-40eb-98f6-2b4b788a7b73/_ds_bundle.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface-page);
    color: var(--text-body);
    font-family: var(--font-sans);
    font-weight: 300;
    line-height: var(--leading-body);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-primary); color: var(--aura-terracotta-deep); }

  a { color: inherit; }

  #root { min-height: 100vh; }

  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding-left: var(--section-pad-x);
    padding-right: var(--section-pad-x);
  }

  section { padding-top: var(--section-pad-y); padding-bottom: var(--section-pad-y); }

  h1, h2, h3 { margin: 0; font-family: var(--font-serif-display); font-weight: 400; color: var(--text-heading); }

  p { margin: 0; }

  .kicker-row { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1.4rem; }
  .kicker-line { height: 1px; width: 2.4rem; background: var(--border-default); }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 40;
    background: rgba(12,19,34,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-default);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.15rem var(--section-pad-x);
  }
  .nav-brand { display: flex; align-items: baseline; gap: 0.5rem; text-decoration: none; }
  .nav-brand .word { font-family: var(--font-serif-display); font-size: 1.3rem; color: var(--text-heading); }
  .nav-brand .tag { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.18em; color: var(--aura-cyan); text-transform: uppercase; }
  .nav-links { display: flex; align-items: center; gap: 2.2rem; }
  .nav-links a {
    font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: var(--tracking-nav);
    text-transform: uppercase; text-decoration: none; color: var(--text-muted);
    transition: color .2s;
  }
  .nav-links a:hover { color: var(--aura-cyan); }
  @media (max-width: 860px) { .nav-links { display: none; } }

  /* hero */
  .hero { padding-top: 6.5rem; position: relative; overflow: hidden; }
  .hero::before {
    content: ''; position: absolute; top: -20%; left: 50%; width: 60rem; height: 60rem;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(194,103,76,0.16) 0%, rgba(194,103,76,0) 65%);
    pointer-events: none;
  }
  .hero-grid { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 4.5rem; align-items: center; }
  @media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; } }
  .hero h1 { font-size: var(--text-display-xl); line-height: var(--leading-tight); letter-spacing: -0.01em; }
  .hero .voice { font-style: italic; color: var(--aura-cyan-dim); }
  .hero .sub { margin-top: 1.6rem; font-size: var(--text-body-md); color: var(--text-body); max-width: 34rem; }
  .hero .cta-row { display: flex; align-items: center; gap: 1.1rem; margin-top: 2.4rem; flex-wrap: wrap; }
  .hero .meta-row { display: flex; gap: 2.2rem; margin-top: 3.2rem; flex-wrap: wrap; }
  .hero .meta-item { font-family: var(--font-mono); font-size: 0.76rem; color: var(--text-muted); }
  .hero .meta-item b { color: var(--aura-cream-100); font-weight: 500; }

  .hero-shot { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-default); box-shadow: 0 30px 80px rgba(0,0,0,0.45); cursor: zoom-in; }
  .hero-shot img { display: block; width: 100%; height: auto; }
  .hero-shot::after {
    content: ''; position: absolute; inset: 0; border-radius: var(--radius-lg);
    box-shadow: inset 0 0 0 1px rgba(110,208,234,0.16);
    pointer-events: none;
  }

  /* section kicker */
  .section-head { max-width: 40rem; margin-bottom: 3.2rem; }
  .section-head h2 { font-size: var(--text-display-md); }

  /* views grid */
  .views-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
  @media (max-width: 980px) { .views-grid { grid-template-columns: 1fr; } }
  .view-card { display: flex; flex-direction: column; gap: 1rem; }
  .view-shot { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-default); background: var(--surface-recessed); cursor: zoom-in; }
  .view-shot img { display: block; width: 100%; height: auto; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,16,32,0.92);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 4vw;
    cursor: zoom-out;
    animation: lbBgIn 0.3s ease;
    overflow: hidden;
  }
  @keyframes lbBgIn { from { opacity: 0; } to { opacity: 1; } }

  .lightbox::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(rgba(110,208,234,0.05) 0px, rgba(110,208,234,0.05) 1px, transparent 1px, transparent 3px);
    animation: lbScan 6s linear infinite;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  @keyframes lbScan { from { background-position: 0 0; } to { background-position: 0 120px; } }

  .lightbox-frame {
    position: relative;
    animation: lbPop 0.55s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes lbPop {
    0%   { transform: scale(0.75); opacity: 0; filter: brightness(4) saturate(0) blur(8px); }
    35%  { opacity: 1; filter: brightness(2.4) saturate(1.4) blur(1px); }
    50%  { transform: scale(1.015); filter: brightness(0.7) blur(0); }
    65%  { transform: scale(0.995); filter: brightness(1.5); }
    100% { transform: scale(1); filter: brightness(1) blur(0); }
  }

  .lightbox-frame::before, .lightbox-frame::after {
    content: ''; position: absolute; width: 2.2rem; height: 2.2rem;
    border: 2px solid var(--aura-cyan);
    opacity: 0; animation: lbBrackets 0.7s 0.15s ease forwards;
    pointer-events: none;
  }
  .lightbox-frame::before { top: -0.6rem; left: -0.6rem; border-right: none; border-bottom: none; }
  .lightbox-frame::after { bottom: -0.6rem; right: -0.6rem; border-left: none; border-top: none; }
  @keyframes lbBrackets { 0% { opacity: 0; transform: scale(1.3); } 60% { opacity: 1; } 100% { opacity: 0.85; transform: scale(1); } }

  .lightbox-sweep {
    position: absolute; left: 0; right: 0; height: 30%;
    background: linear-gradient(rgba(110,208,234,0), rgba(110,208,234,0.35), rgba(110,208,234,0));
    top: -30%;
    animation: lbSweep 0.9s 0.05s ease-out forwards;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  @keyframes lbSweep { from { top: -30%; } to { top: 100%; } }

  .lightbox img {
    max-width: 100%; max-height: 92vh; display: block;
    border-radius: var(--radius-md);
    border: 1px solid rgba(110,208,234,0.5);
    box-shadow: 0 0 0 1px rgba(110,208,234,0.15), 0 0 60px rgba(110,208,234,0.25), 0 40px 100px rgba(0,0,0,0.6);
  }
  .lightbox-close {
    position: fixed; top: 1.6rem; right: 1.8rem;
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: 1px solid var(--border-default);
    background: rgba(12,19,34,0.7);
    color: var(--aura-cream-100);
    font-family: var(--font-mono); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color .2s, color .2s;
    animation: lbBgIn 0.4s ease;
  }
  .lightbox-close:hover { border-color: var(--aura-cyan); color: var(--aura-cyan); transform: rotate(90deg); transition: transform .3s, border-color .2s, color .2s; }

  @media (prefers-reduced-motion: reduce) {
    .lightbox, .lightbox-frame, .lightbox::before, .lightbox-frame::before, .lightbox-frame::after, .lightbox-sweep, .lightbox-close {
      animation: none !important;
    }
    .lightbox-frame::before, .lightbox-frame::after { opacity: 0.85; }
  }
  .view-copy h3 { font-size: 1.15rem; margin-bottom: 0.45rem; }
  .view-copy p { font-size: 0.92rem; color: var(--text-body); font-weight: 300; }

  /* rowlist / stack */
  .stack-section { background: var(--surface-page-warm); }
  .stack-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 3rem; }
  @media (max-width: 900px) { .stack-grid { grid-template-columns: 1fr; } }
  .rowlist { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-warm); }
  .rowlist-row {
    display: grid; grid-template-columns: 9rem 1fr; gap: 1.2rem;
    padding: 1.1rem 1.4rem; background: var(--aura-black-warm);
    border-bottom: 1px solid var(--border-warm);
  }
  .rowlist-row:last-child { border-bottom: none; }
  .rowlist-row .k { font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.06em; color: var(--aura-terracotta); text-transform: uppercase; }
  .rowlist-row .v { font-family: var(--font-mono); font-size: 0.86rem; color: var(--aura-cream-200); }

  /* AI core / terracotta section */
  .terra-section { background: var(--accent-primary); color: var(--aura-terracotta-deep); }
  .terra-section .section-head h2 { color: var(--aura-terracotta-ink); }
  .terra-section .section-head p { color: var(--aura-terracotta-deep); }
  .provider-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 1px; background: var(--aura-terracotta-ink); border-radius: var(--radius-xl); overflow: hidden; }
  .provider-cell {
    background: var(--accent-primary); padding: 1.5rem 1.3rem;
    font-family: var(--font-mono); font-size: 0.82rem; color: var(--aura-terracotta-deep);
    display: flex; align-items: center; justify-content: center; text-align: center;
  }

  /* install */
  .install-section .install-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.2rem; }
  @media (max-width: 900px) { .install-section .install-grid { grid-template-columns: 1fr; } }

  /* footer */
  footer { border-top: 1px solid var(--border-default); padding: 4.5rem 0 3rem; }
  .footer-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 2.5rem; margin-bottom: 3.5rem; }
  .footer-brand .word { font-family: var(--font-serif-display); font-size: 1.4rem; color: var(--text-heading); }
  .footer-brand .voice { font-style: italic; color: var(--aura-cyan-dim); font-family: var(--font-serif-display); font-size: 1.05rem; margin-top: 0.5rem; }
  .stats-row { display: flex; gap: 3.5rem; }
  .footer-bottom {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
    padding-top: 2rem; border-top: 1px solid var(--border-default);
    font-family: var(--font-mono); font-size: 0.76rem; color: var(--text-muted);
  }
  .footer-bottom a { text-decoration: none; color: var(--aura-cyan-dim); }
  .footer-bottom a:hover { color: var(--aura-cyan); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { Button, Card, Label, StatBlock, Terminal } = window.AuraDesignSystem_593988;

const REPO_URL = 'https://github.com/milodule3-debug/aura-pulse';

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVisual": "diagnostics",
  "showMeta": true
}/*EDITMODE-END*/;

function Nav() {
  return (
    <div className="nav">
      <div className="nav-inner">
        <a className="nav-brand" href="#top">
          <span className="word">Aura Pulse</span>
          <span className="tag">telemetry</span>
        </a>
        <div className="nav-links">
          <a href="#views">Views</a>
          <a href="#stack">Stack</a>
          <a href="#ai-core">AI Core</a>
          <a href="#install">Install</a>
          <a href={REPO_URL} target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>
    </div>
  );
}

function Lightbox({ src, alt, onClose }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!src) return null;
  return (
    <div className="lightbox" onClick={onClose}>
      <button className="lightbox-close" onClick={onClose} aria-label="Close">✕</button>
      <div className="lightbox-frame">
        <img src={src} alt={alt} onClick={(e) => e.stopPropagation()} />
        <span className="lightbox-sweep" />
      </div>
    </div>
  );
}

function Hero({ t, onZoom }) {
  const shots = {
    diagnostics: { src: 'assets/shot-diagnostics.png', alt: 'Aura Pulse — System Diagnostics view' },
    optimization: { src: 'assets/shot-optimization.png', alt: 'Aura Pulse — System Optimization view' },
    vault: { src: 'assets/shot-vault.png', alt: 'Aura Pulse — The Vault clipboard view' },
  };
  const shot = shots[t.heroVisual] || shots.diagnostics;
  return (
    <section className="hero" id="top">
      <div className="wrap hero-grid">
        <div>
          <Label tone="cyan">10Hz telemetry · sqlite vault · zero daemons</Label>
          <h1 style={{ marginTop: '1.2rem' }}>
            Your machine,<br /><span className="voice">verified.</span>
          </h1>
          <p className="sub">
            A native Linux cockpit that reads <code style={{ fontFamily: 'var(--font-mono)', color: 'var(--aura-cream-200)' }}>/proc</code> and <code style={{ fontFamily: 'var(--font-mono)', color: 'var(--aura-cream-200)' }}>/sys</code> straight, no shelling out — CPU, memory, GPU and thermals at 10Hz, a searchable clipboard vault, and hardware benchmarks with a real LLM token-speed estimator. Rust backend, dependency-light TypeScript frontend, Tauri 2 shell.
          </p>
          <div className="cta-row">
            <Button variant="solid" href={REPO_URL}>View on GitHub →</Button>
            <Button variant="ghost" href="#install">npm install -g aura-pulse</Button>
          </div>
          {t.showMeta && (
            <div className="meta-row">
              <span className="meta-item"><b>MIT</b> licensed</span>
              <span className="meta-item"><b>Tauri 2</b> + Rust</span>
              <span className="meta-item"><b>Linux x64</b> prebuilt binary</span>
            </div>
          )}
        </div>
        <div className="hero-shot" onClick={() => onZoom(shot.src, shot.alt)}>
          <img src={shot.src} alt={shot.alt} />
        </div>
      </div>
    </section>
  );
}

function SectionHead({ kicker, title, body }) {
  return (
    <div className="section-head">
      <div className="kicker-row">
        <span className="kicker-line" />
        <Label tone="cyan">{kicker}</Label>
      </div>
      <h2>{title}</h2>
      {body && <p style={{ marginTop: '1rem', color: 'var(--text-body)', fontSize: '1.02rem' }}>{body}</p>}
    </div>
  );
}

function Views({ onZoom }) {
  const views = [
    {
      img: 'assets/shot-diagnostics.png',
      title: 'Diagnostics',
      body: 'Per-core load, frequency and temp, memory banks, GPU core, thermals, power draw, storage array, network link and top processes — sampled at 10Hz with no shelling out in the hot path.',
    },
    {
      img: 'assets/shot-optimization.png',
      title: 'Optimization',
      body: 'Performance, balanced and power-saver profiles via power-profiles-daemon. CPU boost, swappiness, core balancing and cache drops — privileged writes go through pkexec, the standard system auth dialog.',
    },
    {
      img: 'assets/shot-vault.png',
      title: 'The Vault',
      body: 'Clipboard history — text and images — persisted in SQLite. Search, pin, filter by kind, and enrich with your configured AI provider: summarize, OCR, describe, convert to markdown.',
    },
  ];
  return (
    <section id="views">
      <div className="wrap">
        <SectionHead kicker="01 — what she watches" title="Four views. One cockpit." />
        <div className="views-grid">
          {views.map((v) => (
            <div className="view-card" key={v.title}>
              <div className="view-shot" onClick={() => onZoom(v.img, `Aura Pulse — ${v.title} view`)}><img src={v.img} alt={`Aura Pulse — ${v.title} view`} /></div>
              <div className="view-copy">
                <h3>{v.title}</h3>
                <p>{v.body}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Stack() {
  const rows = [
    { k: 'Shell', v: 'Tauri 2 (webkit2gtk)' },
    { k: 'Backend', v: 'Rust — hand-rolled telemetry, rusqlite, arboard + wl-paste fallback, reqwest' },
    { k: 'Frontend', v: 'TypeScript + Vite, zero UI frameworks — hand-built charts on <canvas>' },
    { k: 'Storage', v: '~/.local/share/aura-pulse/ (vault), ~/.config/aura-pulse/ai.json (mode 0600)' },
  ];
  return (
    <section className="stack-section" id="stack">
      <div className="wrap stack-grid">
        <SectionHead kicker="02 — how she's built" title="No frameworks. No daemons. No excuses." />
        <div className="rowlist">
          {rows.map((r) => (
            <div className="rowlist-row" key={r.k}>
              <div className="k">{r.k}</div>
              <div className="v">{r.v}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function AiCore() {
  const providers = ['OpenAI', 'Anthropic', 'Gemini', 'DeepSeek', 'Xiaomi MiMo', 'Ollama', 'LM Studio', 'Any OpenAI-compatible endpoint'];
  return (
    <section className="terra-section" id="ai-core">
      <div className="wrap">
        <SectionHead
          kicker="03 — ai core"
          title="Bring your own model."
          body="A multi-provider hub. Every call happens in Rust — API keys never touch the webview DOM. Point The Vault at whichever provider is already running and it enriches clips: summarize, OCR, describe, convert to markdown or design JSON."
        />
        <div className="provider-grid">
          {providers.map((p) => (
            <div className="provider-cell" key={p}>{p}</div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Install() {
  return (
    <section className="install-section" id="install">
      <div className="wrap install-grid">
        <div>
          <SectionHead kicker="04 — install" title="One command on Linux x64." body="Ships a prebuilt binary. Runtime deps are libwebkit2gtk-4.1-0 and GTK 3 — preinstalled on most desktop distros." />
          <Terminal
            label="npm"
            lines={[
              { text: '$ npm install -g aura-pulse', kind: 'prompt' },
              { text: '$ aura-pulse', kind: 'prompt' },
            ]}
          />
        </div>
        <div>
          <div style={{ height: '2.4rem' }} className="build-spacer-mobile-hide" />
          <Terminal
            label="build from source"
            lines={[
              { text: '$ npm install', kind: 'prompt' },
              { text: '$ npm run tauri dev', kind: 'prompt' },
              { text: '  development, hot reload', kind: 'muted' },
              { text: '$ npm run tauri build', kind: 'prompt' },
              { text: '  .deb + .AppImage in src-tauri/target/release/bundle/', kind: 'ok' },
            ]}
          />
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer>
      <div className="wrap">
        <div className="footer-top">
          <div className="footer-brand">
            <div className="word">Aura Pulse</div>
            <div className="voice">I don't guess. I sample.</div>
          </div>
          <div className="stats-row">
            <StatBlock value="10Hz" label="Sample rate" />
            <StatBlock value="0" label="Root daemons" />
            <StatBlock value="MIT" label="License" />
          </div>
        </div>
        <div className="footer-bottom">
          <span>Built by Dušan Milosavljević.</span>
          <a href={REPO_URL} target="_blank" rel="noreferrer">github.com/milodule3-debug/aura-pulse →</a>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [zoomed, setZoomed] = React.useState(null);
  const onZoom = (src, alt) => setZoomed({ src, alt });
  return (
    <React.Fragment>
      <Nav />
      <Hero t={t} onZoom={onZoom} />
      <Views onZoom={onZoom} />
      <Stack />
      <AiCore />
      <Install />
      <Footer />
      <TweaksPanel>
        <TweakSection label="Hero" />
        <TweakRadio
          label="Screenshot"
          value={t.heroVisual}
          options={[{ value: 'diagnostics', label: 'Diag' }, { value: 'optimization', label: 'Opt' }, { value: 'vault', label: 'Vault' }]}
          onChange={(v) => setTweak('heroVisual', v)}
        />
        <TweakToggle label="Show meta row" value={t.showMeta} onChange={(v) => setTweak('showMeta', v)} />
      </TweaksPanel>
      <Lightbox src={zoomed?.src} alt={zoomed?.alt} onClose={() => setZoomed(null)} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="aura-kb.js" defer></script>
<script src="aura-chat.js" data-product="Aura Pulse" defer></script>
</body>
</html>
